# Extra model folders for the local ComfyUI. Paths are relative to this file.
# ComfyUI-Shared/models mirrors ~/ComfyUI-Shared on binc-PC; on this Mac the
# folder layout exists but holds no weights yet. Weights copied into it are
# picked up here without touching the install.
shared:
  base_path: ../../projects/desktop/ComfyUI-Shared/models
  checkpoints: checkpoints
  clip: clip
  clip_vision: clip_vision
  controlnet: controlnet
  diffusion_models: diffusion_models
  embeddings: embeddings
  loras: loras
  upscale_models: upscale_models
  vae: vae

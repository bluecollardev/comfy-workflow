# ComfyUI as a container on a Linux NVIDIA box. One file for both:
#
#   docker compose -f apps/comfy-app/docker/compose.yml up -d      # one box
#   docker stack deploy -c apps/comfy-app/docker/compose.yml comfy # a Swarm
#
# Paths come from the environment (or a .env beside this file):
#   CANALV2_ROOT   host path of the project tree   default /home/binc/CANALV2_r3/CANALV2
#   COMFY_SHARED   host path of ComfyUI-Shared     default /home/binc/ComfyUI-Shared
#   PLATES_ROOT    host path of the served plates   default /mnt/storage/Panama_Redux (read-only in the container)
#   COMFY_IMAGE    image to run                     default comfy-app:v26
#   COMFY_PORT     published port                   default 8188
# Inside the container the project keeps binc-PC's path, so graphs run unchanged.
# GPU: Swarm uses `generic_resources` below (the node must advertise NVIDIA-GPU,
# see swarm.sh init). Plain Compose rejects nothing here but also grants no GPU,
# so swarm.sh up adds compose.gpu.yml, which carries the `devices` request.

services:
  comfy:
    image: ${COMFY_IMAGE:-comfy-app:v26}
    ports:
      - "${COMFY_PORT:-8188}:8188"
    environment:
      COMFY_SHARED: /workspace/ComfyUI-Shared
      COMFY_ARGS: ${COMFY_ARGS:-}
    volumes:
      - ${CANALV2_ROOT:-/home/binc/CANALV2_r3/CANALV2}:/home/binc/CANALV2_r3/CANALV2
      - ${COMFY_SHARED:-/home/binc/ComfyUI-Shared}:/workspace/ComfyUI-Shared
      - ${PLATES_ROOT:-/mnt/storage/Panama_Redux}:/mnt/storage/Panama_Redux:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8188/system_stats',timeout=3)\""]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
      resources:
        reservations:
          generic_resources:
            - discrete_resource_spec:
                kind: NVIDIA-GPU
                value: 1

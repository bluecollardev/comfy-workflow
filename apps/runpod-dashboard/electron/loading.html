<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RunPod Manager</title>
  <style>
    html, body { height: 100%; margin: 0; background: #1E1E1E; color: #BDC1C6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; }
    .box { text-align: center; }
    .spinner { width: 28px; height: 28px; margin: 0 auto 14px; border: 3px solid rgba(255,255,255,.15);
      border-top-color: #00B8EC; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 15px; font-weight: 600; color: #fff; margin: 0 0 4px; }
    p { font-size: 13px; margin: 0; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>RunPod Manager</h1>
    <p>Starting the backend…</p>
  </div>
</body>
</html>

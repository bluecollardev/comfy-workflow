[pytest]
# PyTest configuration for ComfyUI MOE infrastructure

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require RunPod API)
    asyncio: Async tests
    slow: Slow tests (>1 second)

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Asyncio mode
asyncio_mode = auto

# Timeout (seconds)
timeout = 30

# Coverage options
[coverage:run]
source =
    pool_manager.py
    mcp_server.py
    oauth_handler.py
    pod_manager_api.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

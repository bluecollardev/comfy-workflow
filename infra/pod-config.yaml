# Pod defaults, one profile. The live values are in the pod manager (apps/runpod-api) and the
# dashboard's Configuration panel; this file is the human-readable summary of what a new pod is.
#
# Why these: the job runs on binc-PC's RTX A4000 (16 GB) and nothing in the packs asks for more
# than 24 GB, so the menu is the 16-24 GB cards and the 4090 is the default. Community cloud is
# the cheaper tier. The network volume carries the data, so no per-pod volume. A pod with
# nothing queued for 30 minutes is stopped by the pod manager's idle watch. Spend needs Binc's
# named yes and stays inside the USD 100 cap (shared/governance/policy/agent-permissions.md).
pod:
  name: ComfyUI-Dev
  gpu: rtx4090            # a4000 | a5000 | rtx3090 | rtx4090 (apps/runpod-api/gpus.py)
  gpu_count: 1
  cloud: community        # community (cheaper) | secure
  volume_gb: 0            # per-pod volume; the network volume at /workspace carries the data
  container_disk_gb: 20
  image: configured       # the image set in Configuration (ours, with the packs), pushed to a registry first
  idle_stop_minutes: 30   # 0 = never
  ports: [8188/http, 22/tcp]
  ssh: true
  jupyter: false
  mounts: true            # attach the configured network volume and links (docs/MOUNT-POINTS.md)
